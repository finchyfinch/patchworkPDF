# Cross-platform build matrix for Patchwork PDF.
# cx_Freeze cannot cross-compile, so each OS builds on its own runner.
# Artifacts are uploaded per platform; on a tagged push they can be attached to
# a release (wire up the publish step to SourceForge / Flathub as you prefer).
name: build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ── Windows: cx_Freeze build (+ optional Inno Setup installer) ───────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The OCR language packs are tracked binaries that setup.py copies into the
      # build. Gate on them: without this the build still succeeds and quietly
      # produces an artifact that can only OCR in English.
      - name: Verify OCR language data
        run: python tools/fetch_tessdata.py --verify
      - name: Build
        run: python setup.py build
      - uses: actions/upload-artifact@v4
        with:
          name: patchworkpdf-windows
          path: build/exe.*/

  # macOS: cx_Freeze .app -> .dmg (unsigned). cx_Freeze bundles the runner's
  # architecture, so Intel and Apple Silicon each build on a matching runner.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel   # x86_64
            label: Intel
          - runner: macos-14         # arm64
            label: AppleSilicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Verify OCR language data
        run: python tools/fetch_tessdata.py --verify
      - name: Build .app + .dmg
        run: bash packaging/macos/make_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: patchworkpdf-macos-${{ matrix.label }}
          path: dist/*.dmg
      - name: Attach DMG to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.dmg --clobber
  # ── Linux: Flatpak via flatpak-builder ───────────────────────────────────────
  linux-flatpak:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          # Rename to PatchworkPDF-<version>.flatpak when uploading to SourceForge
          # so the in-app update checker's Linux pattern matches (see the Linux doc).
          bundle: PatchworkPDF.flatpak
          manifest-path: packaging/flatpak/com.patchworkpdf.app.yaml
          cache-key: flatpak-builder-${{ github.sha }}


